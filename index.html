<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Cuadre de caja por denominaciones de euro.">
  <title>Cuadre de Caja</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="header-icon" aria-hidden="true">▣</div>
      <div>
        <h1>Cuadre de Caja</h1>
        <p>Introduce las cantidades de cada denominación y calcula el total automáticamente.</p>
      </div>
    </header>

    <section class="grand-total" aria-live="polite">
      <div class="grand-total-label">
        <span class="coins-icon" aria-hidden="true">◉</span>
        <span>Total en caja</span>
      </div>
      <strong id="grand-total">0,00 €</strong>
    </section>

    <section id="denominations" class="grid" aria-label="Denominaciones de euro"></section>

    <div class="actions">
      <button id="reset" type="button" class="reset">↻ &nbsp;Reiniciar</button>
    </div>
  </main>

  <div id="numeric-keypad" class="numeric-keypad" aria-label="Teclado numérico">
    <button type="button" data-key="1">1</button>
    <button type="button" data-key="2">2</button>
    <button type="button" data-key="3">3</button>
    <button type="button" data-key="4">4</button>
    <button type="button" data-key="5">5</button>
    <button type="button" data-key="6">6</button>
    <button type="button" data-key="7">7</button>
    <button type="button" data-key="8">8</button>
    <button type="button" data-key="9">9</button>
    <button type="button" data-key="clear" aria-label="Borrar todo">C</button>
    <button type="button" data-key="0">0</button>
    <button type="button" data-key="backspace" aria-label="Borrar último número">⌫</button>
  </div>

  <template id="denomination-template">
    <article class="card">
      <h2 class="denomination"></h2>
      <div class="field-row">
        <label>Caja fuerte</label>
        <input class="strong-input" type="text" inputmode="none" autocomplete="off" readonly value="" aria-label="Cantidad en caja fuerte">
      </div>
      <div class="field-row">
        <label>Caja menor</label>
        <input class="small-input" type="text" inputmode="none" autocomplete="off" readonly value="" aria-label="Cantidad en caja menor">
      </div>
      <div class="total-row">
        <span>Total</span>
        <strong class="card-total">0,00 €</strong>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
